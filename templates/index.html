<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">📝 Task Manager</h2>
        <form action="/add" method="POST" class="d-flex mb-4">
            <input type="text" name="content" class="form-control me-2" placeholder="Enter new task" required>
            <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <ul class="list-group">
            {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span style="{% if task.completed %}text-decoration: line-through;{% endif %}">
                    {{ task.content }}
                </span>
                <div>
                    {% if not task.completed %}
                    <a href="/complete/{{ task._id }}" class="btn btn-success btn-sm">Complete</a>
                    {% endif %}
                    <a href="/delete/{{ task._id }}" class="btn btn-danger btn-sm">Delete</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
